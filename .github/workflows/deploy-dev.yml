name: Frontend DEV CI/CD (AWS S3 + CloudFront)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build --mode staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy static assets to Amazon S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }} --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "workbox-*.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy no-cache files to Amazon S3
        run: |
          for file in index.html sw.js manifest.webmanifest; do
            if [ -f "./dist/$file" ]; then
              aws s3 cp ./dist/$file s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/$file \
                --cache-control "no-cache,no-store,must-revalidate" \
                --content-type "$(file --mime-type -b ./dist/$file)"
            fi
          done
          for file in ./dist/workbox-*.js; do
            [ -f "$file" ] && aws s3 cp $file s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/$(basename $file) \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      - name: CloudFront Invalidate Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV }} --paths "/*"
