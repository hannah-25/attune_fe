name: Frontend DEV CI/CD (AWS S3 + CloudFront)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build --mode staging
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy static assets to Amazon S3
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }} --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "workbox-*.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy no-cache files to Amazon S3
        run: |
          if [ -f "./dist/index.html" ]; then
            aws s3 cp ./dist/index.html s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/index.html \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html; charset=utf-8"
          fi
          if [ -f "./dist/sw.js" ]; then
            aws s3 cp ./dist/sw.js s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/sw.js \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/javascript"
          fi
          if [ -f "./dist/manifest-v2.webmanifest" ]; then
            aws s3 cp ./dist/manifest-v2.webmanifest s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/manifest-v2.webmanifest \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/manifest+json"
          fi
          for file in ./dist/workbox-*.js; do
            if [ -f "$file" ]; then
              aws s3 cp "$file" s3://${{ secrets.AWS_S3_BUCKET_NAME_DEV }}/$(basename "$file") \
                --cache-control "no-cache,no-store,must-revalidate" \
                --content-type "application/javascript"
            fi
          done

      - name: CloudFront Invalidate Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV }} --paths "/*"
